name: Publish release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filebeam-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Build persistent signed release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Check signing secret availability
        id: signing
        shell: bash
        run: |
          if [[ -n "$SIGNING_KEYSTORE_BASE64" && -n "$SIGNING_KEYSTORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release APK skipped: configure the four persistent signing secrets to produce an install-over-update release."
          fi

      - name: Set up JDK 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        if: steps.signing.outputs.available == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Prepare and validate persistent keystore
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/filebeam-release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/filebeam-release.keystore" \
            -storepass "$SIGNING_KEYSTORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" >/dev/null
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/filebeam-release.keystore"
            echo "KEYSTORE_PASSWORD=$SIGNING_KEYSTORE_PASSWORD"
            echo "KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } > keystore.properties

      - name: Set up Android SDK
        if: steps.signing.outputs.available == 'true'
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android build tools
        if: steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"

      - name: Build and verify signed release APK
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            VERSION="${VERSION%%-*}"
          else
            # The release workflow has its own run counter, which resets to 1 and
            # would produce versions older than the existing v2.0.171 line. Derive
            # the next patch number from the currently published release instead so
            # every main push strictly increases the version.
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
            latest_patch=171
            if [[ "$latest_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              candidate="${latest_tag##*.}"
              if [[ "$candidate" =~ ^[0-9]+$ ]] && (( candidate > latest_patch )); then
                latest_patch="$candidate"
              fi
            fi
            VERSION="2.0.$((latest_patch + 1))"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          MAJOR="${MAJOR:-0}"; MINOR="${MINOR:-0}"; PATCH="${PATCH:-0}"
          if ! [[ "$MAJOR$MINOR$PATCH" =~ ^[0-9]+$ ]]; then echo "Invalid release version: $VERSION"; exit 1; fi
          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          echo "VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Building FileBeam $VERSION (versionCode $VERSION_CODE)"
          gradle assembleRelease -PVERSION_NAME="$VERSION" -PVERSION_CODE="$VERSION_CODE" --stacktrace 2>&1 | tee build.log
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Diagnose build failure
        if: failure() && steps.signing.outputs.available == 'true'
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            echo "::group::Gradle failure excerpt"
            grep -nE '^[ew]: |error:|FAILURE:|Caused by:|> Task .* FAILED' build.log | head -80 || true
            echo "::endgroup::"
            grep -nE '^[ew]: |error:|FAILURE:|Caused by:' build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Upload signed APK and checksum
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: FileBeam-release-apk
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Determine whether this build is the newest release
        if: steps.signing.outputs.available == 'true'
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_code="$VERSION_CODE"
          latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>/dev/null || true)"
          latest_code=0
          if [[ "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            latest_code=$(("${BASH_REMATCH[1]}" * 1000000 + "${BASH_REMATCH[2]}" * 1000 + "${BASH_REMATCH[3]}"))
          fi
          if (( current_code > latest_code )); then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Current version code: $current_code; latest published version code: $latest_code"

      - name: Publish versioned APK to GitHub Release
        if: steps.signing.outputs.available == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', env.VERSION_NAME) }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('FileBeam {0}', github.ref_name) || format('FileBeam {0}', env.VERSION_NAME) }}
          prerelease: false
          make_latest: ${{ steps.latest.outputs.make_latest }}
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256