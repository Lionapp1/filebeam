name: Verify debug build

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: filebeam-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build and verify debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-provider: basic
          cache-disabled: false

      - name: Build debug APK
        run: |
          set -euo pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            echo "::group::Gradle failure excerpt"
            grep -nE '^[ew]: |error:|FAILURE:|Caused by:|> Task .* FAILED' build.log | head -80 || true
            echo "::endgroup::"
            grep -nE '^[ew]: |error:|FAILURE:|Caused by:' build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          fi

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: FileBeam-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14